[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tokaudit"
version = "0.2.0"
description = "Analyze LLM request logs to find wasted prompt tokens and quantify prompt-caching savings"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
exact = ["tiktoken>=0.5"]
dev = ["pytest>=7", "tiktoken>=0.5"]

[project.scripts]
tokaudit = "tokaudit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
